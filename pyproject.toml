[project]
name = "puerto-rico-sim"
version = "0.1.0"
description = "Puerto Rico (base game) simulator with automated players"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
